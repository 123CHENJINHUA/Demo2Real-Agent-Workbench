facts:
- RGBD 回合插入约22.83mm、对键误差约0.04°，随后原位开爪完成。
- 同回合自由落桌后一个卡齿承力重叠面积为0，双卡扣保持检查失败。
- 位姿代理的另一变位回合释放后保持通过，不能覆盖该 RGBD 负例。
diagnosis:
  state: hypothesis
  explanation: 保持失败已观察到，但导致失效的唯一物理/估计根因尚未证实。
  alternatives:
  - 释放/冲击及配合间隙可能影响捕获。
  - 几何、弹性、数值接触、初始姿态和估计偏差需要分开试验。
source_mitigation:
  actions:
  - 保留未解决状态，拆开动作完成、释放前锁止和落桌后保持。
  - 复核功能几何、实际挠曲/回弹和数值稳定性，并设计受控释放/保持试验。
  - 以可靠 CAD/实测核验机构和材料，而非任意提高摩擦/刚度。
